# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  lint:
    desc: Runs linter
    cmds:
      - go fmt ./...
      - golangci-lint run ./...
  lint-fix:
    desc: Runs linter with auto-fix
    cmds:
      - go fmt ./...
      - golangci-lint run --fix ./...

  test:
    desc: Run tests
    cmds:
      - go test ./... -race

  rename:
    desc: "Runs on project scaffold to rename the project (usage: task rename -- new-name)"
    cmds:
      - |
        [ -n "{{.CLI_ARGS}}" ] || { echo "Usage: task rename -- <new-name>"; exit 1; }
        for file in ./* ./.*; do
          [ -f "$file" ] || continue
          sed -i.bak "s/rib/{{.CLI_ARGS}}/g" "$file" && rm -f "$file.bak"
        done

  tag:
    desc: Create a git tag
    cmd: git tag -a {{.V}} -m "Release {{.V}}"
