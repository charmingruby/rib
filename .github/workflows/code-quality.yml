name: Code Quality

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install dependencies
        run: go mod tidy

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.1
